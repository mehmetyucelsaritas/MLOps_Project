steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build container image'
  args: [
    'build',
    '.',
    '-t',
    'europe-west1-docker.pkg.dev/dtumlops-482618/firegpt-container-registry/firegpt-image',
    '-f',
    './dockerfiles/firegpt.dockerfile'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push container image'
  args: [
    'push',
    europe-west1-docker.pkg.dev/dtumlops-482618/firegpt-container-registry/firegpt-image
  ]
